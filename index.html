<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EverClean QQS — Управление</title>
<meta name="theme-color" content="#111111">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f6f3ec;
    --ink: #111111;
    --muted: #6b6760;
    --rule: #d9d4c7;
    --accent: #1f6f5c;
    --card: #fffdf8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    display: grid;
    grid-template-columns: 220px 1fr;
  }
  aside {
    border-right: 2px solid var(--ink);
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .brand {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 22px;
    line-height: 1.1;
    padding-bottom: 16px;
    margin-bottom: 12px;
    border-bottom: 1px solid var(--rule);
  }
  .brand small {
    display: block;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 4px;
  }
  nav button {
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    padding: 10px 12px;
    font: 500 14px 'Inter', sans-serif;
    color: var(--ink);
    cursor: pointer;
    border-radius: 4px;
  }
  nav button:hover { background: var(--rule); }
  nav button.active { background: var(--ink); color: var(--paper); }
  main { padding: 32px 40px; }
  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 36px;
    font-weight: 900;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 12px;
    margin-bottom: 24px;
  }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .card {
    background: var(--card);
    border: 1px solid var(--rule);
    padding: 20px;
    min-height: 140px;
  }
  .card h2 {
    font-size: 12px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .card p { line-height: 1.5; }
  .version { margin-top: auto; font-size: 11px; color: var(--muted); }
  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; }
    aside { border-right: none; border-bottom: 2px solid var(--ink); }
    .grid { grid-template-columns: 1fr; }
    main { padding: 20px; }
  }
</style>
</head>
<body>
  <aside>
    <div class="brand">EverClean QQS<small>Система за управление</small></div>
    <nav id="nav">
      <button class="active" data-section="dashboard">Табло</button>
    </nav>
    <div class="version">v0.1 — начална версия</div>
  </aside>

  <main>
    <header><h1 id="section-title">Табло</h1></header>
    <section id="content">
      <div class="grid">
        <div class="card">
          <h2>Добре дошли</h2>
          <p>Системата е свързана и се публикува автоматично. Опишете следващата функция и тя ще се появи тук.</p>
        </div>
        <div class="card">
          <h2>Статус</h2>
          <p>Последна промяна: <span id="build-date"></span></p>
        </div>
      </div>
    </section>
  </main>

<script>
  document.getElementById('build-date').textContent =
    new Date(document.lastModified).toLocaleString('bg-BG');
</script>
</body>
</html>
